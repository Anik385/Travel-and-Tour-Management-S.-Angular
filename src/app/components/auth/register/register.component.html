<div class="register-container">
  <div class="register-card">
    <h2>Create Account</h2>
    
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>
    
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onRegister()" #registerForm="ngForm">
      <!-- Username -->
      <div class="form-group">
        <label>Username *</label>
        <input type="text" [(ngModel)]="user.username" name="username" required>
      </div>
      
      <!-- Name -->
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" [(ngModel)]="user.firstName" name="firstName">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="user.lastName" name="lastName">
        </div>
      </div>
      
      <!-- Email -->
      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="user.email" name="email" required>
      </div>
      
      <!-- Phone -->
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" [(ngModel)]="user.phone" name="phone">
      </div>
      
      <!-- Passwords -->
      <div class="form-group">
        <label>Password *</label>
        <input type="password" [(ngModel)]="user.password" name="password" required minlength="6">
      </div>
      
      <div class="form-group">
        <label>Confirm Password *</label>
        <input type="password" [(ngModel)]="user.confirmPassword" name="confirmPassword" required>
      </div>
      
      <!-- Submit -->
      <button type="submit" [disabled]="isLoading || registerForm.invalid">
        {{ isLoading ? 'Registering...' : 'Register' }}
      </button>
    </form>
    
    <div class="login-link">
      Already have an account? <a routerLink="/login">Login here</a>
    </div>
  </div>
</div>
