<div class="login-container">
  <div class="login-card">
<h2>
  <span class="plane-icon"></span> Login to TravelTour
</h2>    
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="credentials.username"
          required
          placeholder="Enter your username"
          [disabled]="isLoading"
        >
        <div *ngIf="loginForm.submitted && loginForm.controls['username']?.errors" class="validation-error">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          placeholder="Enter your password"
          [disabled]="isLoading"
        >
        <div *ngIf="loginForm.submitted && loginForm.controls['password']?.errors" class="validation-error">
          Password is required
        </div>
      </div>

      <button type="submit" [disabled]="isLoading || loginForm.invalid" class="btn-login">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading">Logging in...</span>
      </button>

      <div class="login-links">
        <p>Don't have an account? <a routerLink="/register">Register here</a></p>
        <p><a routerLink="/forgot-password">Forgot password?</a></p>
      </div>
      <div class="social-login">
      <button class="social-btn google">
        <i class="fab fa-google"></i>
        Google
      </button>
      <button class="social-btn facebook">
        <i class="fab fa-facebook"></i>
        Facebook
      </button>
    </div>

      <!-- <div class="demo-credentials" *ngIf="!isLoading">
        <h4>Demo Credentials:</h4>
        <p><strong>Admin:</strong> admin123 / admin123</p>
        <p><strong>User:</strong> testuser / test123</p>
      </div> -->
    </form>
  </div>
</div>
