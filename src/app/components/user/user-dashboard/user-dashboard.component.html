<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Welcome back, Anik!</h1>
    <p>Here's your travel overview</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon upcoming">
        <i class="fas fa-calendar-check"></i>
      </div>
      <div class="stat-info">
        <h3>2</h3>
        <p>Upcoming Trips</p>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon completed">
        <i class="fas fa-check-circle"></i>
      </div>
      <div class="stat-info">
        <h3>5</h3>
        <p>Completed Trips</p>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon wishlist">
        <i class="fas fa-heart"></i>
      </div>
      <div class="stat-info">
        <h3>3</h3>
        <p>Wishlisted Tours</p>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon reviews">
        <i class="fas fa-star"></i>
      </div>
      <div class="stat-info">
        <h3>4</h3>
        <p>Reviews Given</p>
      </div>
    </div>
  </div>

  <div class="dashboard-content">
    <div class="upcoming-trips">
      <h2>Upcoming Trips</h2>
      <div class="trip-list">
        <div class="trip-card" *ngFor="let trip of upcomingTrips">
          <img [src]="trip.image" [alt]="trip.title">
          <div class="trip-info">
            <h4>{{trip.title}}</h4>
            <p class="trip-date">{{trip.date}}</p>
            <p class="trip-destination">{{trip.destination}}</p>
            <div class="trip-status confirmed">Confirmed</div>
          </div>
          <button class="btn-view" routerLink="/my-bookings">View Details</button>
        </div>
      </div>
    </div>

    <div class="quick-actions">
      <h2>Quick Actions</h2>
      <div class="action-grid">
        <button class="action-btn" routerLink="/tours">
          <i class="fas fa-search"></i>
          <span>Browse Tours</span>
        </button>
        <button class="action-btn" routerLink="/my-bookings">
          <i class="fas fa-list"></i>
          <span>My Bookings</span>
        </button>
        <button class="action-btn">
          <i class="fas fa-heart"></i>
          <span>Wishlist</span>
        </button>
        <button class="action-btn">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
        </button>
      </div>
    </div>
  </div>
</div>
