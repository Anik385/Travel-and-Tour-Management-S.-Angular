<div class="admin-tours">
  <div class="page-header">
    <h1>Manage Tours ({{filteredTours.length}})</h1>
    <button class="btn-primary" routerLink="/admin/tours/new">
      <i class="fas fa-plus"></i>
      Add New Tour
    </button>
    <button class="btn-refresh" (click)="loadTours()" [disabled]="isLoading">
      <i class="fas fa-sync-alt" [class.fa-spin]="isLoading"></i>
      Refresh
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="isLoading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading tours...</p>
  </div>

  <!-- Content when loaded -->
  <div *ngIf="!isLoading">
    <div class="tools-bar">
      <!-- Keep existing search/filter code -->
    </div>

    <div class="tours-table">
      <!-- Keep existing table code -->
    </div>

    <div class="empty-state" *ngIf="filteredTours.length === 0">
      <i class="fas fa-plane"></i>
      <h3>No tours found</h3>
      <p *ngIf="tours.length === 0">No tours available. Create your first tour!</p>
      <p *ngIf="tours.length > 0">No tours match your search criteria</p>
      <button class="btn-primary" routerLink="/admin/tours/new">
        Create New Tour
      </button>
    </div>
  </div>
</div>
