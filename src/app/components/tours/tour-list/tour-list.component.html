<div class="tour-list">
  <!-- Filters Section -->
  <div class="filters-section">
    <h2>Find Your Perfect Tour</h2>
    
    <div class="filters">
      <input type="text" placeholder="Search destinations or tours..."
             [(ngModel)]="searchTerm" 
             (input)="applyFilters()"
             class="search-input">
      
      <select [(ngModel)]="destinationFilter" (change)="applyFilters()" class="filter-select">
        <option value="">All Destinations</option>
        <option value="bali">Bali</option>
        <option value="dubai">Dubai</option>
        <option value="paris">Paris</option>
        <!-- Add more options -->
      </select>
      
      <button (click)="applyFilters()" class="filter-btn">Apply Filters</button>
      <button (click)="clearFilters()" class="clear-btn">Clear All</button>
    </div>
    
    <div class="results-info" *ngIf="filteredTours.length > 0">
      Showing {{ filteredTours.length }} of {{ tours.length }} tours
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading tours...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage && !isLoading" class="error-state">
    <i class="fas fa-exclamation-triangle"></i>
    <h3>Oops!</h3>
    <p>{{ errorMessage }}</p>
    <button (click)="loadTours()" class="retry-btn">Retry</button>
  </div>

  <!-- Tours Grid -->
  <div class="tours-container" *ngIf="!isLoading && !errorMessage">
    <div class="tours-grid">
      <!-- Use your existing TourCardComponent -->
      <app-tour-card 
        *ngFor="let tour of filteredTours" 
        [tour]="tour">
      </app-tour-card>
    </div>

    <!-- No Results -->
    <div *ngIf="filteredTours.length === 0 && !isLoading" class="no-tours">
      <i class="fas fa-search"></i>
      <h3>No tours found</h3>
      <p>Try adjusting your search filters or 
        <a (click)="clearFilters()">clear all filters</a>
      </p>
    </div>
  </div>
</div>
