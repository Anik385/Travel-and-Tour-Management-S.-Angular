<div class="cart-container">
  <h2>Shopping Cart</h2>
  
  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty</p>
    <button routerLink="/tours">Browse Tours</button>
  </div>
  
  <div *ngIf="cartItems.length > 0">
    <div class="cart-items">
      <div *ngFor="let item of cartItems; let i = index" class="cart-item">
        <img [src]="item.image" [alt]="item.title">
        <div class="item-details">
          <h3>{{ item.title }}</h3>
          <p>{{ item.destination }} • {{ item.duration }} days</p>
          <p class="price">${{ item.price }}</p>
        </div>
        <button (click)="removeItem(i)">Remove</button>
      </div>
    </div>
    
    <div class="cart-summary">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Subtotal</span>
        <span>${{ total }}</span>
      </div>
      <div class="summary-row">
        <span>Taxes</span>
        <span>${{ (total * 0.10).toFixed(2) }}</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span>${{ (total * 1.10).toFixed(2) }}</span>
      </div>
      
      <div class="cart-actions">
        <button (click)="clearCart()">Clear Cart</button>
        <button routerLink="/checkout" class="checkout-btn">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</div>
